name: Android

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*", "android-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name for the APK (e.g. 1.1.2)"
        default: "1.1.2"
        required: true
      release_tag:
        description: "Release tag. Leave blank to use android-v<version_name>"
        default: ""
      create_release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare release signing identity
        run: bash android/scripts/make-keystore.sh

      - name: Unit tests (normalisation, queue, assist rules)
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          gradle --no-daemon --stacktrace testStandaloneDebugUnitTest \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/unit-tests.log"

      - name: Android lint (device-behaviour checks)
        working-directory: android
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          gradle --no-daemon --stacktrace lintStandaloneRelease \
            -Pairwhispers.versionName="${VERSION_NAME:-1.1.2}" \
            -Pairwhispers.versionCode="${{ github.run_number }}" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/lint.log"

      - name: Assemble release APK (standalone flavour)
        working-directory: android
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          gradle --no-daemon --stacktrace assembleStandaloneRelease \
            -Pairwhispers.versionName="${VERSION_NAME:-1.1.2}" \
            -Pairwhispers.versionCode="${{ github.run_number }}" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/assemblestandalonerelease.log"

      - name: Assemble debug APK
        working-directory: android
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          gradle --no-daemon --stacktrace assembleStandaloneDebug \
            -Pairwhispers.versionName="${VERSION_NAME:-1.1.2}" \
            -Pairwhispers.versionCode="${{ github.run_number }}" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/assemblestandalonedebug.log"

      - name: Compile the FCM flavour (cloud push)
        working-directory: android
        continue-on-error: true
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          gradle --no-daemon --stacktrace assembleFcmRelease \
            -Pairwhispers.versionName="${VERSION_NAME:-1.1.2}" \
            -Pairwhispers.versionCode="${{ github.run_number }}"

      # Renders the failure inside the check-run annotation, which stays readable even
      # when the raw log or the uploaded artifacts are not reachable.
      - name: Explain the failure
        if: failure()
        run: |
          python3 .github/scripts/failure-summary.py
          if [ -f "$GITHUB_WORKSPACE/build-logs/annotation.txt" ]; then
            cat "$GITHUB_WORKSPACE/build-logs/annotation.txt"
          fi

      - name: Collect APKs and checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -print -exec cp {} artifacts/ \;
          cd artifacts
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done
          ls -la

      # GitHub's log download endpoint is not reachable from every environment, so the
      # raw output and the HTML/JUnit reports are published as an artifact as well.
      - name: Upload build logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs
          path: |
            build-logs/**
            android/app/build/reports/tests/**
            android/app/build/test-results/**
            android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      # Proves the artefact rather than trusting the build: signature, package id,
      # version and the presence of the Hindi resources are all checked here.
      - name: Verify the release APK
        run: |
          set -euo pipefail
          APK="artifacts/app-standalone-release.apk"
          EXPECTED_VERSION="${{ inputs.version_name }}"
          EXPECTED_VERSION="${EXPECTED_VERSION:-1.1.2}"

          echo "::group::APK integrity"
          test -f "$APK" || { echo "::error::release APK missing"; exit 1; }
          unzip -t "$APK" >/dev/null || { echo "::error::APK is not a valid zip"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex"   || { echo "::error::no classes.dex in APK"; exit 1; }
          unzip -l "$APK" | grep -q "resources.arsc" || { echo "::error::no resources.arsc in APK"; exit 1; }
          (cd artifacts && sha256sum -c app-standalone-release.apk.sha256)
          echo "::endgroup::"

          echo "::group::Manifest (aapt2)"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          AAPT2="$BUILD_TOOLS/aapt2"
          if [ -x "$AAPT2" ]; then
            BADGING="$("$AAPT2" dump badging "$APK")"
            echo "$BADGING" | head -5
            PKG="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            [ "$PKG" = "com.airwhispers" ] || { echo "::error::package is '$PKG', expected com.airwhispers"; exit 1; }
            VNAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
            [ "$VNAME" = "$EXPECTED_VERSION" ] || { echo "::error::versionName is '$VNAME', expected '$EXPECTED_VERSION'"; exit 1; }
            if printf '%s\n' "$BADGING" | grep -q "^application-debuggable"; then
              echo "::error::release APK is debuggable"; exit 1
            fi
          else
            echo "aapt2 not found, skipping manifest checks"
          fi
          echo "::endgroup::"

          echo "::group::Signature"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -8
          else
            echo "apksigner not found, skipping signature check"
          fi
          echo "::endgroup::"

          echo "::group::Bundled languages"
          # Devanagari bytes ("अभी") inside resources.arsc — i.e. the Hindi UI shipped.
          if unzip -p "$APK" resources.arsc | grep -aq $'\xe0\xa4\x85\xe0\xa4\xad\xe0\xa5\x80'; then
            echo "Hindi (hi) resources present"
          else
            echo "::error::Hindi resources are missing from the release APK"; exit 1
          fi
          echo "::endgroup::"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: airwhispers-apks
          path: artifacts/**
          if-no-files-found: error

  release:
    name: Publish release
    needs: android
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.create_release) ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
       startsWith(github.event.head_commit.message, 'release: publish Android '))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: airwhispers-apks
          path: apks

      - name: Compose release notes
        run: |
          cat > notes.md <<'NOTES'
          ## AirWhispers for Android

          Hands-free messaging: while you are on a call in WhatsApp, Telegram, Meet,
          Discord, Signal or the dialer, incoming AirWhispers messages can be spoken
          aloud through your speaker, wired headset or Bluetooth earbuds.

          ### Install
          1. Download `app-standalone-release.apk` (signed) below.
          2. On the phone, allow "Install unknown apps" for your browser/file manager.
          3. Open the app, enter the address of your AirWhispers server, create an account.
          4. Call Assist → **Start Call Assist**. Add your chat partner as a *trusted* contact.
          5. Get a message while on a call: it is spoken to you. Nothing else to do.

          ### Notes
          * `app-standalone-release.apk` — recommended. No Google/Firebase account needed;
            messages arrive over the app's own realtime channel while Call Assist is armed.
          * `app-standalone-debug.apk` — same code with debug logging, for troubleshooting.
          * Verify the download with the matching `.sha256` file.
          * AirWhispers never records calls, never opens the microphone and never touches
            another app's call audio. It speaks to *you*, the person holding this phone.
          * Automatic call detection is a documented heuristic — see
            `docs/android-limitations.md`. A manual "Start Call Assist" switch always works.

          ### iOS
          Android ships today. iOS shares the same backend and protocol; see
          `docs/ios.md` for the build path (a Mac or Codemagic runner is required by Apple).
          NOTES
          echo "" >> notes.md
          echo "Commit: \`$GITHUB_SHA\`" >> notes.md
          echo "Build and verification: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> notes.md
          echo "" >> notes.md
          echo "Signed with the repository's demo identity; not intended for production-store distribution." >> notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${INPUT_TAG:-android-v${INPUT_VERSION:-1.1.2}}"
          fi
          # An explicit branch release must not displace a newer release line.
          LATEST_OPTIONS=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* ]]; then
            LATEST_OPTIONS=(--latest=false)
          fi
          echo "Releasing as $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/*.apk apks/*.sha256 --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "AirWhispers Android $TAG" \
              --notes-file notes.md \
              "${LATEST_OPTIONS[@]}" \
              apks/*.apk apks/*.sha256
          fi
          gh release view "$TAG" --json url,assets --jq '"release: \(.url)", (.assets[] | "asset: \(.name) (\(.size) bytes)")'
