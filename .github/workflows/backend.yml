name: Backend

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit & API tests
        run: npm test
        env:
          LOG_LEVEL: silent

      - name: Smoke test against a live server
        run: |
          set -euo pipefail
          JWT_SECRET=ci-secret-that-is-long-enough-123456 PORT=8099 LOG_LEVEL=warn node dist/src/server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/smoke.mjs http://127.0.0.1:8099

  # The API tests run over the in-memory store; store.pg.ts — the code that runs
  # in production — is otherwise only type-checked, and a real bug hid there
  # once (a malformed id became a database error). This job executes the SQL
  # against real PostgreSQL.
  postgres:
    name: PostgreSQL store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: airwhispers
          POSTGRES_PASSWORD: airwhispers
          POSTGRES_DB: airwhispers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airwhispers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://airwhispers:airwhispers@127.0.0.1:5432/airwhispers_test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Apply the schema (the deploy path)
        run: DATABASE_URL="$TEST_DATABASE_URL" npm run schema

      - name: Store tests against real PostgreSQL
        run: npm test
