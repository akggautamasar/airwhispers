# Demo signing identity for AirWhispers release builds.
#
# THIS IS A PUBLIC DEMO KEY. It exists so that anyone (including CI) can build a
# signed, installable APK out of the box. It provides integrity, not identity.
#
# Before distributing on a store, replace airwhispers-release.cert.pem and
# airwhispers-release.key.pem with your own identity and update the passwords
# below (or pass -PstorePassword=... etc. through your CI secret store).
storeFile=airwhispers-release.p12
storeType=PKCS12
storePassword=airwhispers
keyAlias=airwhispers
keyPassword=airwhispers
