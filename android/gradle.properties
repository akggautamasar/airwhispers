org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# Version of the published artifact. CI overrides these with -Pairwhispers.version*.
airwhispers.versionCode=1
airwhispers.versionName=1.0.0

# Default backend used by a fresh install. Users can change it in Settings > Account.
# Empty string means "not configured yet" and the app shows the setup screen.
airwhispers.defaultBackendUrl=
